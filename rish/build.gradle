plugins {
    id('com.android.library')
}

android {
    namespace 'rikka.rish'
    defaultConfig {
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures {
        buildConfig = false
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.11.0'

    testImplementation 'junit:junit:4.13.2'
}

ext.rustPackages = ['rish']
apply from: rootProject.file('gradle/rust-native.gradle')

ext {
    publishLibrary = true
    POM_NAME = "Nightzuku API - rish"
    POM_DESCRIPTION = "Interactive PTY shell and process-group spawner bridge backed by librish.so."
}
