apply from: 'manifest.gradle'

subprojects {
    // Keep every module in the kerneldroid.nightzuku library group so that
    // @RestrictTo(LIBRARY_GROUP_PREFIX) constants remain usable across modules.
    group = "io.github.kerneldroid"

    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            buildToolsVersion = "37.0.0"
            ndkVersion = "29.0.14206865"
            defaultConfig {
                minSdk = 25
                targetSdk = 37
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }

    afterEvaluate { project ->
        if (!(it.findProperty('publishLibrary') ?: false)) {
            return
        }

        plugins.apply('maven-publish')

        if (project.parent == rootProject) {
            group = "${groupIdBase}"
        } else {
            group = "${groupIdBase}.${project.parent.name}"
        }
        version = api_version_name

        publishing {
            if (System.getenv("GITHUB_TOKEN") != null) {
                repositories {
                    maven {
                        name = "GitHubPackages"
                        url = uri("https://maven.pkg.github.com/kerneldroid/nightzuku-api")
                        credentials {
                            username = System.getenv("GITHUB_ACTOR") ?: "kerneldroid"
                            password = System.getenv("GITHUB_TOKEN")
                        }
                    }
                }
            }

            publications {
                mavenJava(MavenPublication) {
                    group project.group
                    artifactId project.name
                    version api_version_name
                    afterEvaluate {
                        from components.release
                    }
                    pom {
                        name = POM_NAME
                        description = POM_DESCRIPTION
                        url = POM_URL
                        licenses {
                            license {
                                name = POM_LICENCE_NAME
                                url = POM_LICENCE_URL
                            }
                        }
                        developers {
                            developer {
                                name = POM_DEVELOPER_NAME
                                url = POM_DEVELOPER_URL
                            }
                        }
                        scm {
                            connection = POM_SCM_CONNECTION
                            url = POM_SCM_URL
                        }
                    }
                }
            }
        }

        android {
            publishing {
                singleVariant("release") {
                    withSourcesJar()
                }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

ext {
    groupIdBase = "io.github.kerneldroid"

    POM_INCEPTION_YEAR = "2026"
    POM_PACKAGING = "aar"

    POM_URL = "https://github.com/kerneldroid/nightzuku-api"
    POM_SCM_URL = "https://github.com/kerneldroid/nightzuku-api"
    POM_SCM_CONNECTION = "scm:git@github.com:kerneldroid/nightzuku-api.git"
    POM_SCM_DEV_CONNECTION = "scm:git@github.com:kerneldroid/nightzuku-api.git"

    POM_LICENCE_NAME = "MIT License"
    POM_LICENCE_URL = "https://github.com/kerneldroid/nightzuku-api/blob/master/LICENSE"
    POM_LICENCE_DIST = "repo"

    POM_DEVELOPER_ID = "kerneldroid"
    POM_DEVELOPER_NAME = "kerneldroid"
    POM_DEVELOPER_URL = "https://github.com/kerneldroid"
}
