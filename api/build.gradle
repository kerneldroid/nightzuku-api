plugins {
    id('com.android.library')
}

android {
    namespace 'rikka.shizuku.api'
    defaultConfig {
    }
    buildFeatures {
        buildConfig = false
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    api project(':aidl')
    api project(':shared')

    implementation 'androidx.annotation:annotation:1.11.0'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
}

ext {
    publishLibrary = true
    POM_NAME = "Nightzuku API - client"
    POM_DESCRIPTION = "Native Nightzuku Kotlin client API and legacy Shizuku compatibility layer."
}
