plugins {
    id('com.android.library')
}

android {
    namespace 'rikka.shizuku.aidl'
    buildFeatures {
        buildConfig = false
        aidl = true
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

ext {
    publishLibrary = true
    POM_NAME = "Nightzuku API - AIDL"
    POM_DESCRIPTION = "Low-level AIDL contracts for Nightzuku and legacy Shizuku compatibility."
}
